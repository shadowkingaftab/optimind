# Alembic configuration for the EyeDx backend.
#
# The database URL is intentionally left blank here and supplied at runtime
# from the application settings (DATABASE_URL) inside migrations/env.py, so
# the same configuration works across environments without embedding
# credentials in the repository.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Determine the database URL from the application settings at runtime.
# (Left empty on purpose; see migrations/env.py.)
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
