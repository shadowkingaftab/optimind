[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eyedx-backend"
version = "0.1.0"
description = "EyeDx screening backend API (screening aid only; not a medical device)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "EyeDx" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "gunicorn>=21.2,<24.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "email-validator>=2.1",
    "sqlalchemy[asyncio]>=2.0.28,<3.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "pyjwt>=2.8,<3.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.1,<5.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.3,<25.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
    "pytest>=8.1,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI dependency defaults

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
