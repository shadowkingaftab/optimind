# Production training config.
#
# Extends the baseline with production-scale settings. Resource limits, GPU
# availability and approved data/weights are INPUT_REQUIRED. Thresholds and
# acceptance criteria are never set here; they belong to model approval.

schema_version: "1.0.0"
name: production

model:
  config: ml/configs/models/multilabel.yaml

data:
  dataset_config: ml/configs/datasets/fundus_dataset.yaml
  manifest: datasets/interim/manifest.csv
  splits_dir: datasets/splits
  train_split: train
  validation_split: validation
  image_root: datasets/raw
  augmentation: ml/configs/augmentation/strong.yaml
  num_workers: 8
  pin_memory: true

optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.05

scheduler:
  name: cosine
  warmup_epochs: 2
  min_lr: 0.0000001

training:
  epochs: 100
  batch_size: 32
  grad_accum_steps: 2
  grad_clip_norm: 1.0
  mixed_precision: true                  # INPUT_REQUIRED: requires compatible GPU

  early_stopping:
    enabled: true
    monitor: val_loss
    patience: 10
    min_delta: 0.0001
    mode: min

checkpointing:
  output_dir: ml/checkpoints
  save_best: true
  save_last: true
  monitor: val_loss
  mode: min

reproducibility:
  seed: 42
  deterministic: true
  benchmark: false

experiment:
  name: production
  output_dir: ml/experiments
  log_every_n_steps: 100

distributed:
  enabled: true                          # INPUT_REQUIRED: GPU/multi-node resources
  backend: nccl
  world_size: INPUT_REQUIRED
