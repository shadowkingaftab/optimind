# Inference development config
# INPUT_REQUIRED: actual model path/artifact if used

model:
  model_id: eyedx-screening
  model_version: 1.0.0
  device: cpu
  batch_size: 1
  timeout_seconds: 30
  max_image_mb: 10

quality:
  min_resolution: 224  # INPUT_REQUIRED per model
  min_brightness: 0.2  # INPUT_REQUIRED per model
  max_blur_score: 0.3  # INPUT_REQUIRED per model

uncertainty:
  enabled: true
  method: max_prob
  threshold: 0.6  # INPUT_REQUIRED: clinical/model approval

abstention:
  enabled: true
  threshold: 0.5  # INPUT_REQUIRED

explanation:
  enabled: false
  method: gradcam  # requires approval/artifacts
