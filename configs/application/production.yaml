# Production application config
# INPUT_REQUIRED: set actual values for production
# No secrets

api:
  version: v1
  prefix: /api/v1
  host: 0.0.0.0
  port: 8000
  request_timeout_seconds: 30

cors:
  allow_origins: []  # INPUT_REQUIRED: comma-separated production origins
  allow_credentials: true
  allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
  allow_headers: ["*"]

features:
  explainability: false
  uncertainty: true
  abstention: true

limits:
  max_upload_mb: 5
  rate_limit_per_minute: 60

security:
  consent_required: true
