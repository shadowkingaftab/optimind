# Development application config
# Non-sensitive defaults
# INPUT_REQUIRED: adjust for local environment

api:
  version: v1
  prefix: /api/v1
  host: 0.0.0.0
  port: 8000
  request_timeout_seconds: 30

cors:
  allow_origins:
    - http://localhost:3000
    - http://localhost:5173
  allow_credentials: true
  allow_methods: ["*"]
  allow_headers: ["*"]

features:
  explainability: false
  uncertainty: true
  abstention: true

limits:
  max_upload_mb: 5
  rate_limit_per_minute: 60

security:
  consent_required: true
